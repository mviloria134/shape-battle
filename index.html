<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Battle!</title>
</head>
<body>
    <div class="app-container">
        <canvas id="app"></canvas>
        <div class="battle-interface">
            <div class="enemy mon-info">
                <h2 class="name"></h2>
                <div class="health-bar">
                    <span>HP: </span>
                    <span class="hp"></span>
                </div>
            </div>
            <div class="player mon-info">
                <h2 class="name">Green Guy</h2>
                <div class="health-bar">
                    <span>HP: </span>
                    <span class="hp"></span>
                </div>
            </div>
            <ul class="options">
                <li><button>Fight</button></li>
                <li><button>Mon</button></li>
                <li><button>Bag</button></li>
                <li><button>Run</button></li>
            </ul>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
